<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
     <link rel="stylesheet" type="text/css" href="https://cdn.curator.io/6.0/curator.embed.css" />
     <link rel="stylesheet" href="style.css"/>
     <link rel="manifest" href="manifest.json"/>

    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>




<body>
   

<div class="sticky-top">
<h1 
     class="container-fluid bg-body-tertiary display-4 border-bottom border-2 border-black mb-0"> Meal tracker 
     <small class="text-muted float-end" style="font-size: 35%"> Demo by Harvey Bosworth</small>
</h1>


<div class="progress rounded-0 d-none" role="progressbar" style="height: 6px;" id="loadingindicator">
  <div class="progress-bar progress-bar-striped progress-bar-animated bg-warning" style="width: 100%"></div>
</div>
</div>

<br>



<div class="pageview container-fluid mb-5" id="homePage">
     
          <div class="px-2 mb-5" id="curator-feed-default-feed-layout"><a href="https://curator.io" target="_blank" class="crt-logo crt-tag">Powered by Curator.io</a></div>
     </div>

<div class="pageview container-fluid" id="mealsPage" style="display:none">

     <div class="d-flex text-center mx-auto justify-content-between col-12 col-md-8">
     <h2>Meals</h2>
     
          

     

     <div>
          <input class="btn btn-primary" type="button" id="createmealbtn" value="Create" onclick="togglePages('createmealPage')"/>
          <input class="btn btn-secondary me-1" type="button" id="viewallbtn" value="View all"  onclick="togglePages('viewallmealsPage')"/>

     </div>
     
     </div>
     <p class="text-muted d-flex text-center mx-auto justify-content-between col-12 col-md-8">Recently made</p>

          <div class= "mx-auto d-flex flex-wrap justify-content-center col-12 col-md-8" id="recentlymademeals">

          </div>
          <div> <!--SO NAVBAR DOESN'T OBSTRUCT CARDS WHEN FULLY SCROLLED-->
               <br>
               <br>
               <br>
               
          </div>
          
          
     </div>
     
          <!-- create meals -->
          <div class="pageview container-fluid col-12 col-md-9 mb-5" id="createmealPage" style="display:none">

               <form id="mealform">

               <div class=" d-flex text-center mx-auto justify-content-between">
               <button class="btn btn-secondary" type="button" id="backbtn" value="◀" onclick="togglePages('mealsPage')">
               <img src="source/backarrow.png" id="backarrow"></button>

               <h2 class="pt-1">Create</h2>


               <div>
               <input class="btn btn-primary" type="submit" value="Confirm" id="submit">
               <input class="btn btn-secondary" type="reset" value="Reset" onclick="resetForm()">
               </div>
               </div>

          <div class="container text-center mt-4">
               <div class="d-flex mx-auto ">
                    <div class="input-group">
                    <label class="input-group-text" for="mealname"> Meal <br> name:</label>
                    <input class="form-control" type="text" id="mealname" name="mealname" required>   
                    </div>
               </div>
          </div>     

          <div class="container text-center mt-4">
               <div class="d-flex mx-auto ">
                    <div class="input-group">
                    <label class="input-group-text" id="URLlabel" for="URL"> Video URL:</label>

                    <input class="form-control" type="text" id="URL" name="URL">
                    </div>
               </div>
          </div>
                    
          <div class="container text-start mt-3">
               <div class="mx-auto">
               <div class="justify-content-between d-flex mb-1">
                    <label> Instructions + Ingredients:</label>
                    <input class="btn btn-outline-secondary pt-0 pb-0  px-1 d-none" id="paste" type="button" value="Paste" onclick="urlPaste()">
               </div>
                    <textarea class="form-control" id="instructions" name="instructions" style="height: 150px; line-height: 1.4;"></textarea>
                     
               </div>
          </div>

          <div class="container text-center mt-4">
               <div class="d-flex mx-auto align-items-center ">
                    
               <div class="input-group ">
                    <label class="input-group-text"for="calories"> Calories:</label>
                    <input class="form-control me-3 " type="number" id="calories" name="calories">
               </div>           

               <div class="input-group ">
                    <label class="input-group-text" for="cost"> Cost:</label> 
                    <p class=" mb-0 input-group-text">£</p> 
                    <input class="form-control" type="number" step="0.01" id="cost" name="cost">
               </div>
                    
               </div>
          </div>

           <div class="container text-center mt-4 pb-4">
               <div class="d-flex mx-auto  justify-content-center align-items-center ">
                    
               <div class="input-group">

                    <label class="input-group-text" for="category"> Category:</label>
                    <select class="form-select me-4 rounded-end" id="category" name="category" value="Select">
                         <option value="n/a">Select</option>
                         <option value="breakfast">Breakfast</option>
                         <option value="lunch">Lunch</option>
                         <option value="dinner">Dinner</option>
                         <option value="baking/dessert">Baking/Dessert</option>
                         <option value="snack">Snack</option>
                    </select>
               
                   
                    <label class= "pt-2 btn btn-outline-primary rounded" for="mealimage">📸</label>
                    <input type="file" id="mealimage" name="mealimage" style="display:none;" accept="image/png, image/jpeg, image/heic, image/jpg"><br>
               </div>   
               </div>
                    <div class="pt-4 d-flex mx-auto justify-content-center align-items-center col-12 col-md-9">
                         <button class="border-0 bg-transparent" type="button" onclick="deleteImg()">
                         <img style="display:none;" class="img-preview border border-5 rounded" id="preview" src="" >
                         </button>
                         </div>
                    </div>
                    <br>
                    <br>
          </div>
               


               </form>



               </div>

               <!-- view all meals -->
          <div class="pageview container-fluid mb-5" id="viewallmealsPage" style="display:none">
               <div class="d-flex text-center mx-auto col-12 col-md-8">
               <button class="btn btn-secondary" type="button" id="backbtn" value="◀" onclick="togglePages('mealsPage')">
          <img src="source/backarrow.png" id="backarrow">
          </button>
          <h2 class="pt-1 ps-3 pb-4">View all</h2>
          </div>
          
          <div class="mx-auto col-12 col-md-6 ">
               <h3> Breakfast</h3>
                    <div id="breakfast" style="height: 410px" class="card-scroll d-flex overflow-auto overflow-y-hidden flex-wrap flex-column align-content-start ps-2 pe-5 mx-auto">

               </div>
          </div>
               <br>

          <div class="mx-auto col-12 col-md-6 ">
               <h3> Lunch</h3>
               <div id="lunch" style="height: 410px" class="card-scroll d-flex overflow-auto overflow-y-hidden flex-wrap flex-column align-content-start ps-2 pe-5 mx-auto">

                    </div>
                    </div>
               <br>

          <div class="mx-auto col-12 col-md-6">    
               <h3> Dinner</h3>
               <div id="dinner" style="height: 410px" class="card-scroll d-flex overflow-auto overflow-y-hidden flex-wrap flex-column align-content-start ps-2 pe-5 mx-auto">

                    </div>
                    </div>
               <br>

          <div class="mx-auto col-12 col-md-6">
               <h3> Baking/Dessert</h3>
               <div id="baking/dessert" style="height: 410px" class="card-scroll d-flex overflow-auto overflow-y-hidden flex-wrap flex-column align-content-start ps-2 pe-5 mx-auto">

                    </div>
                    </div>
               <br>     
          

          <div class="mx-auto col-12 col-md-6">
               <h3> Snacks</h3>
               <div id="snack" style="height: 410px" class="card-scroll d-flex overflow-auto overflow-y-hidden flex-wrap flex-column align-content-start pe-5 mx-auto">

                    </div>
                    </div>          
               <br>

               </div>


               <!-- calendar interface -->
<div class="pageview mb-5" id="calendarPage" style="display:none">
     <div style="height: 500px">
          <div id='calendar' class="px-4 col-12 col-md-8 d-flex mx-auto my-auto" ></div>
     </div>
</div>

     

               <!-- settings interface -->
<div class="pageview container-fluid col-12 col-md-8 mb-5" id="settingsPage" style="display:none">

     <h2>Settings</h2>

<div class="container text-center mt-5">
  <div class="d-flex justify-content-between ">

     <label class="form-check-label my-auto" for="darkmodebtn">Dark mode</label>
     <div class="form-check form-switch">
      <input class="form-check-input" style="min-width: 100px; min-height: 30px;" type="checkbox" role="switch" id="darkmodebtn" value="dark mode" onclick="theme()"/>
     
     </div>
</div>

<div class="d-flex justify-content-between align-items-center pt-5">

     <p class="me-3 text-start my-auto"> Export data for importing on another device</p>
     
      <button type="button" class="btn btn-outline-secondary" style="min-width: 100px;" onclick="exportData()">Export</button>

</div>

<div class="d-flex justify-content-between align-items-center pt-5">

     <p class="me-3 text-start my-auto"> Import data using exported file</p>

     <label class= "btn btn-outline-secondary" style="min-width: 100px;" for="importInput">Import</label>
      <input type="file" id="importInput"style="display: none;" class="btn btn-outline-secondary" style="min-width: 100px;" onclick="importData()" accept=".json"></button>

</div>

<div class="d-flex justify-content-between align-items-center pt-5">

     <p class="me-3 text-start my-auto"> Remove all saved data</p>
     
      <button type="button" class="btn btn-outline-danger" style="min-width: 100px;" onclick="clearData()">Reset</button>

</div>

<div class="d-flex justify-content-between align-items-center pt-5">
     <pwa-install></pwa-install>
     

</div>

</div>

     


     </div>
     
     
     
     


<br>
<nav class="nav navbar"> 

<div class="container-fluid navbar-footer fixed-bottom bg-body-tertiary mb-4 px-4 py-1 rounded-4 col-md-6 col-lg-4 col-11" id="navbuttons">
     <input class ="btn nav-btn btn-lg active" role="button" aria-pressed="true" type ="button" id="homebtn" value="🏠" onclick="togglePages('homePage', 'homebtn')" />
     <input class ="btn nav-btn btn-lg" role="button" aria-pressed="true" type ="button" id="mealpagebtn" value="🍕" onclick="togglePages('mealsPage', 'mealpagebtn')" />  
     <input class ="btn nav-btn btn-lg" role="button" aria-pressed="true" type ="button" id="calendarbtn" value="📆" onclick="togglePages('calendarPage', 'calendarbtn')" />  
     <input class ="btn nav-btn btn-lg" role="button" aria-pressed="true" type ="button" id="settingsbtn" value="⚙" onclick="togglePages('settingsPage', 'settingsbtn')" />  
</div>
</nav>

<!--meal modal html, hidden-->
<div class="modal fade" id="mealModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" id="mealModalHeader" >
        
        
          
        
      </div>
      <div class="modal-body" id="mealModalBody">
     
      </div>
      <div class="modal-footer" id ="mealModal-footer"> <!-- where buttons go, created in script.js-->
        
      </div>
    </div>
  </div>
</div>

<!--calendar modal html, hidden-->
<div class="modal fade" id="calendarModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content">
      <div class="modal-header" >
        <h5 class="modal-title text-wrap text-break" id="calModalTitle">Date</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
     
      <div class="modal-body pe-1 d-flex justify-content-center flex-wrap" id="calModalBody">
      </div>
      <div class="modal-footer justify-content-between" id ="calModal-footer"> <!-- where buttons go, created in script.js-->
        
      </div>
    </div>
  </div>
</div>

</body>

</html>
